services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: reconcile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reconcile_dev

volumes:
  postgres_data: